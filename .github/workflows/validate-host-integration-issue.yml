name: Validate host integration issue

on:
  issues:
    types: [opened, edited, labeled]

jobs:
  validate:
    if: contains(github.event.issue.labels.*.name, 'host-integration')
    runs-on: ubuntu-latest
    steps:
      - name: Check required fields exist in issue body
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || "";

            const requiredMarkers = [
              "### Host product",
              "### Host product version",
              "### Dynamo version"
            ];

            const missing = requiredMarkers.filter(marker => !body.includes(marker));

            if (missing.length) {
              core.setFailed(`Missing required issue form sections: ${missing.join(", ")}`);
            }